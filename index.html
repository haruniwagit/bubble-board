<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040405">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bubble Board">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23040405'/%3E%3Crect x='10' y='10' width='26' height='44' rx='8' fill='none' stroke='%23eef0f3' stroke-width='3'/%3E%3Crect x='40' y='10' width='14' height='20' rx='5' fill='none' stroke='%23eef0f3' stroke-width='3'/%3E%3Crect x='40' y='34' width='14' height='20' rx='5' fill='none' stroke='%23eef0f3' stroke-width='3'/%3E%3C/svg%3E">
<title>Bubble Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a tiling bubble screen. The page is a tree of rows and columns that always fills the viewport; black bubbles are its leaves, white outlines are grouped branches. Dividers resize neighbours; drops split or swap. Phones stack. Monochrome by design. */
:root{
  color-scheme:dark;
  --bg:#040405;
  --panel:#0d0e11; --panel-h:#101115; --line:#191b20; --line-2:#2a2d34;
  --ink:#eef0f3; --soft:#b9bec7; --muted:#7d838e; --faint:#4a4f58;
  --group:rgba(255,255,255,.85);
  --bad:#ff8a80; --warn:#f5c27a;
  --gap:8px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--soft);outline-offset:2px;border-radius:5px}

.top{flex:none;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:9px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top h1{font-family:var(--display);font-weight:500;font-size:15px;margin:0;letter-spacing:-.01em;cursor:text;min-width:0;overflow-wrap:break-word;hyphens:auto;border-radius:6px;padding:1px 4px;margin-left:-4px;transition:background .15s}
.top h1:hover{background:var(--line)}
.top h1 .edit{font:inherit;min-width:220px}
.top .meta{display:flex;gap:12px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.status[data-s="saving"]{color:var(--warn)} .status[data-s="error"]{color:var(--bad)}
.newbtn{border:1px solid var(--line-2);background:none;border-radius:999px;padding:2px 11px;font-size:12px;color:var(--soft);font-family:var(--body)}
.newbtn:hover{color:var(--ink);border-color:var(--muted)}
.newb>button{border:1px solid var(--line-2);background:none;border-radius:999px;padding:2px 11px;font-size:12px;color:var(--soft);font-family:var(--body)}
.newb>button:hover{color:var(--ink);border-color:var(--muted)}
.pop{position:absolute;right:0;top:calc(100% + 6px);z-index:100;background:#111216;border:1px solid var(--line-2);border-radius:12px;padding:4px;display:flex;flex-direction:column;min-width:160px}
.pop button{border:0;background:none;text-align:left;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--soft);font-family:var(--body)}
.pop button:hover{background:var(--line);color:var(--ink)}
.pop hr{border:0;border-top:1px solid var(--line-2);margin:4px 6px}

/* the screen */
.screen{flex:1;min-height:0;display:flex;padding-block:0 max(10px,env(safe-area-inset-bottom,0px));padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.split{display:flex;min-width:0;min-height:0;position:relative}
.split.row{flex-direction:row;align-items:stretch} .split.col{flex-direction:column}
.screen>.split{flex:1}
.split.group{border:1.5px solid var(--group);border-radius:24px;padding:9px;cursor:grab;transition:box-shadow .2s}
.split.group:hover{box-shadow:0 0 0 4px rgba(255,255,255,.05)}
.split.group.lifted{cursor:grabbing}
.gtools{position:absolute;top:-10px;right:22px;z-index:5;display:flex;gap:6px;visibility:hidden;opacity:0;transition:opacity .15s,visibility 0s .15s}
.gtools button{border:1px solid var(--group);background:var(--bg);color:var(--ink);border-radius:999px;font-size:11px;padding:0 8px;line-height:18px;cursor:pointer}
.gtools button:hover{background:var(--ink);color:var(--bg)}
.split.group:hover>.gtools,.gtools:focus-within{visibility:visible;opacity:1;transition:opacity .15s}
.split.group.lifted>.gtools{visibility:hidden}
@media (hover:none){.gtools{visibility:visible;opacity:.8}}

.divider{flex:none;position:relative;z-index:3;touch-action:none}
.split.row>.divider{width:var(--gap);cursor:col-resize}
.split.col>.divider{height:var(--gap);cursor:row-resize}
.divider::after{content:"";position:absolute;border-radius:2px;background:var(--soft);opacity:0;transition:opacity .15s}
.split.row>.divider::after{top:50%;left:2.5px;width:3px;height:34px;margin-top:-17px}
.split.col>.divider::after{left:50%;top:2.5px;height:3px;width:34px;margin-left:-17px}
.divider:hover::after,.divider.on::after{opacity:.6}

/* bubbles */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;min-width:0;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;padding:13px 15px 11px;gap:8px;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:border-color .15s,background .15s,box-shadow .2s}
.panel:hover{border-color:var(--line-2);background:var(--panel-h)}
.panel.lifted{cursor:grabbing;z-index:50;box-shadow:0 24px 70px rgba(0,0,0,.75),0 0 0 1px var(--line-2);opacity:.92}
.split.group.lifted{z-index:50;opacity:.85}
.panel.pressing{border-color:var(--muted)}
.panel.popin{animation:popin .38s cubic-bezier(.2,.9,.25,1.15)}
@keyframes popin{from{transform:scale(.82);opacity:0}}
:is(.panel) :is(.t,.ptitle,.stitle,.nt,.gt,.gw,input,textarea){user-select:text;-webkit-user-select:text;cursor:text}
.panel :is(button,.ck){cursor:pointer}
.body{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;flex:1;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;margin-right:-6px;padding-right:6px;margin-left:-14px;padding-left:14px}

.ph{display:flex;align-items:baseline;gap:10px;flex:none}
.ptitle{font-family:var(--display);font-weight:500;font-size:1.15em;line-height:1.25;min-width:0;overflow-wrap:break-word;hyphens:auto;margin:0;letter-spacing:-.005em}
.pmeta{font-size:.82em;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto;padding-left:6px}
.gear{border:0;background:none;color:var(--muted);border-radius:6px;padding:0 4px;font-size:15px;line-height:1;letter-spacing:1px;opacity:0;transition:opacity .15s;align-self:center}
.panel:hover .gear,.gear[aria-expanded="true"],.gear:focus-visible{opacity:1}
@media (hover:none){.gear{opacity:.8}}
.prog{height:1px;background:var(--line);flex:none;margin:-2px 0 2px}
.prog i{display:block;height:100%;background:var(--soft);opacity:.55}

.panel{position:relative;container-type:inline-size;container-name:bubble}
/* text follows the bubble: ~12px in a slim bubble, up to ~17px in a wide one; titles scale a little faster */
.panel>.ph,.panel>.body{font-size:clamp(12px,1.25cqi + 9.5px,17px)}
.panel>.ph .ptitle{font-size:clamp(13px,2.2cqi + 8px,23px)}
.ph{position:relative}
.tools{position:absolute;top:-3px;right:-6px;display:flex;gap:2px;padding:2px 4px;border-radius:8px;background:var(--panel-h);opacity:0;transition:opacity .15s;font-size:14px}
.panel:hover .tools,.tools:focus-within,.tools.open{opacity:1}
.panel:hover .pmeta,.panel:has(.tools.open) .pmeta{visibility:hidden}
@media (hover:none){.panel:hover .pmeta{visibility:visible}}
@media (hover:none){.tools{opacity:.85}}
.tools .gear{opacity:1}
@container bubble (max-width:230px){ .pmeta{display:none} .panel>.body{gap:7px} .drow{flex-wrap:wrap;gap:0 8px} .when{min-width:0} .src{flex-basis:100%} }
@container bubble (max-width:150px){ .item{gap:6px} .item .d,.note .nf .d{display:none} .gw{display:none} }
.stretch{position:absolute;z-index:4;touch-action:none}
.stretch.top,.stretch.bottom{left:50%;width:64px;margin-left:-32px;height:12px;cursor:ns-resize}
.stretch.top{top:0} .stretch.bottom{bottom:0}
.stretch.left,.stretch.right{top:50%;height:64px;margin-top:-32px;width:12px;cursor:ew-resize}
.stretch.left{left:0} .stretch.right{right:0}
.stretch::after{content:"";position:absolute;background:var(--muted);border-radius:2px;opacity:0;transition:opacity .15s}
.stretch.top::after,.stretch.bottom::after{left:16px;right:16px;height:3px;top:4.5px}
.stretch.left::after,.stretch.right::after{top:16px;bottom:16px;width:3px;left:4.5px}
.panel:hover>.stretch::after{opacity:.55}
.stretch:hover::after,.stretch.on::after{opacity:1;background:var(--ink)}
.panel.lifted>.stretch{display:none}
.item,.note{position:relative}
.igrip{position:absolute;z-index:6;left:-13px;top:.2em;width:11px;font-size:11px;line-height:1.4;letter-spacing:-3px;color:var(--faint);cursor:grab;opacity:0;transition:opacity .15s;touch-action:none;user-select:none;-webkit-user-select:none}
:is(.item,.note):hover>.igrip{opacity:1}
.igrip:hover{color:var(--ink)}
@media (hover:none){.igrip{opacity:.5}}
:is(.item,.note).dragging{opacity:.3}
.iline{position:fixed;z-index:45;height:2px;border-radius:1px;background:var(--ink);pointer-events:none;display:none;box-shadow:0 0 6px rgba(255,255,255,.4)}
.iline.on{display:block}
.adder{flex-wrap:wrap}
.adder input[type=text],.adder textarea{flex:1 1 9em}
.dchips{display:flex;gap:4px;flex:none;flex-wrap:wrap}
.dchip{border:1px solid var(--line-2);background:none;border-radius:999px;padding:0 9px;line-height:20px;font-size:.8em;color:var(--muted);white-space:nowrap}
.dchip:hover{border-color:var(--muted);color:var(--ink)}
.dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.due-btn,.when.btn{border:0;background:none;padding:0 3px;margin-left:-3px;border-radius:5px;line-height:1.5;cursor:pointer;text-align:left}
.due-btn:hover,.when.btn:hover{background:var(--line);color:var(--ink)}
.add-due{opacity:0;transition:opacity .15s}
:is(.item,.note):hover .add-due,.add-due:focus-visible{opacity:1}
@media (hover:none){.add-due{opacity:.5}}
.duepop{position:fixed;z-index:300;width:244px;background:#111216;border:1px solid var(--line-2);border-radius:14px;padding:10px;box-shadow:0 18px 50px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--soft);user-select:none;-webkit-user-select:none}
.dq{display:flex;gap:6px;align-items:center}
.dq button{border:1px solid var(--line-2);background:none;border-radius:999px;padding:0 11px;line-height:24px;font-size:12px;color:var(--soft)}
.dq button:hover{border-color:var(--muted);color:var(--ink)}
.dq button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dq .dclear{margin-left:auto;border-color:transparent;color:var(--bad)}
.dq .dclear:hover{border-color:transparent;color:var(--bad);background:var(--line)}
.dm{display:flex;align-items:center;justify-content:space-between;color:var(--ink);font-size:13px}
.dnav{border:0;background:none;color:var(--muted);font-size:17px;line-height:1;width:28px;height:28px;border-radius:8px}
.dnav:hover{background:var(--line);color:var(--ink)}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dw{font-size:10.5px;color:var(--faint);padding:2px 0}
.dd{border:0;background:none;border-radius:8px;height:29px;font-size:12.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.dd:hover{background:var(--line);color:var(--ink)}
.dd.past{color:var(--faint)}
.dd.today{box-shadow:inset 0 0 0 1px var(--muted);color:var(--ink)}
.dd.sel{background:var(--ink);color:var(--bg);box-shadow:none}
.bul{color:var(--muted);flex:none;width:.7em;line-height:inherit;text-align:center}
.note>.bul{position:absolute;left:-1em;top:0}
.notes:has(.bul) .note{padding-left:1em}
.notes:has(.bul) .note>.bul{left:0}
.panel.droptarget{border-color:var(--soft);box-shadow:0 0 0 1px var(--soft)}
.ighost{position:fixed;left:0;top:0;z-index:400;pointer-events:none;max-width:260px;padding:5px 10px;border-radius:9px;background:#16181d;border:1px solid var(--line-2);color:var(--ink);font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.indicator{position:fixed;z-index:40;pointer-events:none;border:1.5px dashed var(--soft);background:rgba(255,255,255,.06);border-radius:18px;transition:left .12s,top .12s,width .12s,height .12s,opacity .12s;opacity:0}
.indicator.on{opacity:1}

/* settings */
.drawer{padding:2px 0 6px;display:flex;flex-direction:column;gap:10px;cursor:default;flex:0 1 auto;min-height:70px;max-height:55%;overflow:auto;scrollbar-width:thin}
.body{min-height:48px}
.pgroup{display:flex;flex-direction:column;gap:3px}
.lbl{font-size:11px;color:var(--faint);letter-spacing:.02em}
.switches{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:2px 14px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;background:none;padding:2px 0;font-size:12.5px;color:var(--muted);text-align:left}
.sw i{width:24px;height:14px;border-radius:7px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{color:var(--soft)}
.sw[aria-checked="true"] i{background:rgba(255,255,255,.28)}
.sw[aria-checked="true"] i::after{transform:translateX(10px);background:var(--ink)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{border:1px solid var(--line-2);background:none;border-radius:999px;padding:0 9px;font-size:12px;color:var(--muted);line-height:20px}
.seg:hover{color:var(--ink);border-color:var(--muted)}
.seg[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.danger{margin-left:auto;border:0;color:var(--bad);background:none;padding:0 2px;font-size:12px;opacity:.8}

/* inside a bubble */
.sec{display:flex;flex-direction:column;gap:2px;min-width:0}
.sh{display:flex;align-items:center;gap:6px}
.caret{border:0;background:none;color:var(--faint);padding:0;width:14px;font-size:10px;line-height:1;transition:transform .15s}
.caret[aria-expanded="false"]{transform:rotate(-90deg)}
.stitle{font-size:.9em;color:var(--muted);overflow-wrap:break-word;hyphens:auto}
.sh .scount{font-size:.8em;color:var(--faint)}
.sh .x{margin-left:auto}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.item{display:flex;align-items:flex-start;gap:10px;padding:2px 0;min-width:0;transition:opacity .2s}
.ck{appearance:none;-webkit-appearance:none;width:15px;height:15px;border-radius:50%;border:1.5px solid var(--faint);margin:3px 0 0;flex:none;background:none;position:relative;transition:background .12s,border-color .12s}
.ck:hover{border-color:var(--soft)}
.ck:checked{background:var(--soft);border-color:var(--soft)}
.ck:checked::after{content:"";position:absolute;left:4px;top:1.5px;width:4px;height:7px;border:solid var(--bg);border-width:0 1.8px 1.8px 0;transform:rotate(45deg)}
.item .ix{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.item .t{min-width:0;overflow-wrap:break-word;hyphens:auto;color:var(--ink)}
.item .n,.note .n{font-size:.85em;color:var(--faint);margin-top:1px;font-variant-numeric:tabular-nums;min-width:12px}
.gw{color:var(--muted);font-size:.9em;overflow-wrap:break-word;hyphens:auto}
.gw.ph-sub{color:var(--faint);opacity:0;transition:opacity .15s}
:is(.item,.note):hover .gw.ph-sub{opacity:1}
@media (hover:none){.gw.ph-sub{opacity:.6}}
.feed{display:flex;flex-direction:column;gap:2px}
.item .d+.x{margin-left:0}
.item .ix+.x,.item .ix+.d{margin-left:auto}
.item.done{opacity:.45}
.item.done .t{text-decoration:line-through;text-decoration-color:var(--faint)}
.d{font-size:.8em;color:var(--faint);white-space:nowrap;margin-top:2px}
.d.over{color:var(--bad)} .d.soon{color:var(--warn)}
.x{border:0;background:none;color:var(--faint);padding:0 3px;border-radius:5px;font-size:1em;line-height:1.4;opacity:0;flex:none}
.item .x{margin-left:auto}
:is(.item,.sh,.note,.goal):hover .x,.x:focus-visible,.x.arm{opacity:1}
.x.arm{color:var(--bad);font-size:.8em}
@media (hover:none){.x{opacity:.55}}
.x:hover{color:var(--bad)}

.addline{border:0;background:none;color:var(--faint);font-size:.92em;padding:2px 0;text-align:left;align-self:flex-start;opacity:0;transition:opacity .15s,color .15s}
.panel:hover .addline,.addline:focus-visible,.sec.empty-sec .addline{opacity:1}
@media (hover:none){.addline{opacity:1}}
.addline:hover{color:var(--soft)}
.adder{display:flex;gap:8px;align-items:center;padding:2px 0}
.adder input[type=text],.adder textarea{flex:1;min-width:0;border:0;border-bottom:1px solid var(--line-2);background:none;padding:2px 0;font-size:1em;outline:none;resize:none}
.adder :is(input[type=text],textarea):focus{border-bottom-color:var(--soft)}
.adder input[type=date]{border:0;background:none;color:var(--muted);font-size:.8em;max-width:125px}
.edit{width:100%;border:0;border-bottom:1px solid var(--soft);background:none;padding:0;outline:none;font:inherit;color:inherit}
textarea.edit{resize:none;min-height:66px}
.empty{color:var(--faint);font-size:.92em}

.goals{display:flex;flex-direction:column;gap:8px}
.goal{display:flex;gap:10px;min-width:0}
.goal .n{font-size:12px;color:var(--faint);margin-top:2px;font-variant-numeric:tabular-nums}
.goal .gx{display:flex;flex-direction:column;min-width:0;flex:0 1 auto}
.goal .gt{font-size:15px;overflow-wrap:break-word;hyphens:auto}
.goal .gw{color:var(--muted);font-size:.9em;overflow-wrap:break-word;hyphens:auto}
.goal .x{margin-left:auto}

.drow{display:flex;gap:12px;align-items:baseline;min-width:0}
.when{font-size:.85em;color:var(--muted);min-width:5.2em;flex:none}
.when.over{color:var(--bad)} .when.soon{color:var(--warn)}
.what{min-width:0;overflow-wrap:break-word;hyphens:auto;flex:0 1 auto}
.src{color:var(--faint);font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.notes{columns:15em;column-gap:1.5em}
.note{break-inside:avoid;display:flex;flex-direction:column;gap:2px;margin-bottom:12px;min-width:0}
.note .nt{white-space:pre-wrap;overflow-wrap:break-word;hyphens:auto;color:var(--soft);font-size:1.03em;line-height:1.55}
.notes.lined .note{border-left:1px solid var(--line-2);padding-left:10px}
.note .nf{display:flex;gap:8px;align-items:center;font-size:.8em;color:var(--faint);min-height:16px}

.placeholder-empty{margin:auto;border:1px dashed var(--line-2);border-radius:18px;padding:30px;text-align:center;color:var(--muted);max-width:420px}

/* phones: one column, natural heights */
@media (max-width:700px){
  html,body{height:auto}
  .screen{display:block}
  .split,.split.row,.split.col{flex-direction:column;gap:var(--gap)}
  .split>*{flex:none!important}
  .divider,.stretch{display:none}
  .split.group{cursor:default;padding:10px}
  .panel{cursor:default;max-height:none}
  .body{overflow:visible;flex:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* page basics */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
#app{display:flex;flex-direction:column;flex:1;min-height:0}
/* sign-in */
.auth{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:var(--bg);
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.3px);background-size:22px 22px;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px max(16px,env(safe-area-inset-right,0px))}
.authcard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line-2);border-radius:20px;padding:28px 26px 22px;display:flex;flex-direction:column;gap:14px}
.brand{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.brand i{width:14px;height:14px;border:1.5px solid var(--ink);border-radius:5px;display:inline-block}
.authsub{margin:-6px 0 4px;color:var(--muted);font-size:14px}
.authcard label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.authcard input{background:var(--bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);outline:none}
.authcard input:focus{border-color:var(--soft)}
.primary{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:11px 14px;font-size:14.5px;font-weight:500;margin-top:4px}
.primary:disabled{opacity:.5;cursor:default}
.authmsg{font-size:13px;color:var(--muted);min-height:1.2em}
.authmsg.err{color:var(--bad)} .authmsg.ok{color:#9fe0b4}
.authlinks{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.authlinks button{border:0;background:none;color:var(--muted);font-size:13px;padding:2px 0}
.authlinks button:hover{color:var(--ink)}
/* account menu */
.acct{position:relative}
.acctbtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);background:none;color:var(--soft);font-size:11.5px;font-family:var(--body);text-transform:uppercase;padding:0}
.acctbtn:hover{border-color:var(--muted);color:var(--ink)}
.acct .pop{min-width:220px}
.acct .who{padding:6px 10px 8px;color:var(--faint);font-size:12px;border-bottom:1px solid var(--line-2);margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--body)}
/* one-off notice under the top bar */
.notice{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));padding:8px 12px;border:1px solid var(--line-2);border-radius:12px;color:var(--soft);font-size:13px}
.notice .seg{line-height:22px}
.notice .x{opacity:1;margin-left:auto}
</style>
</head>
<body>

<div class="auth" id="auth" hidden>
  <form class="authcard" id="authForm" novalidate>
    <div class="brand"><i aria-hidden="true"></i>Bubble Board</div>
    <p class="authsub" id="authSub">Sign in to your board.</p>
    <label id="emailRow">Email<input id="email" type="email" autocomplete="email" required></label>
    <label id="pwRow">Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
    <div class="authmsg" id="authMsg" role="status" aria-live="polite"></div>
    <button class="primary" id="authGo" type="submit">Sign in</button>
    <div class="authlinks"><button type="button" id="toggleMode">New here? Create an account</button><button type="button" id="forgot">Forgot password?</button></div>
  </form>
</div>
<div id="app" hidden>
<header class="top">
  <h1 id="boardTitle" title="Click to rename">My Board</h1>
  <div class="meta"><span id="today"></span><span class="status" id="status">Loading…</span>
    <button type="button" id="newBtn" class="newbtn">+ Bubble</button>
    <div class="acct"><button type="button" id="acctBtn" class="acctbtn" aria-haspopup="true" aria-expanded="false" title="Account"></button></div>
  </div>
</header>
<div class="notice" id="notice" hidden></div>
<main class="screen" id="screen" aria-label="Board"></main>
</div>
<div class="indicator" id="indicator" aria-hidden="true"></div>
<div class="iline" id="iline" aria-hidden="true"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script>
(() => {
  document.documentElement.lang = document.documentElement.lang || "en";
  let LS = "bubble-board-site";
  const MIN = 90;
  const uid = () => Math.random().toString(36).slice(2, 10);
  const BASE = { bullets: false, daily: false, ticks: true, done: true, progress: true, dates: true, numbers: false, sub: false, notes: false, added: false, feed: false, overdue: true, days: 7 };
  const TEXTY = "input,textarea,button,a,label,.ck,.t,.ptitle,.stitle,.nt,.gw,.edit,.what,.drawer,.adder,.divider";
  let state = { v: 6, panels: [], layout: null };
  let openGear = null, armed = null, editing = false, dirty = false, saving = false, pending = null, gesture = false;
  let ref = null, mode = "loading", saveTimer = null, localRev = "", focusAdder = false, popId = null;
  const adding = {};

  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else if (k === "style") n.setAttribute("style", v);
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, ""); else if (v !== false && v != null) n.setAttribute(k, v);
    }
    kids.flat().forEach(c => c != null && n.append(c));
    return n;
  };
  const today0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const dayDiff = iso => Math.round((new Date(iso + "T00:00:00") - today0()) / 864e5);
  const fmtDue = iso => { const n = dayDiff(iso);
    if (n < -1) return `${-n}d late`; if (n === -1) return "1d late"; if (n === 0) return "today"; if (n === 1) return "tomorrow";
    if (n < 7) return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { weekday: "short" });
    return new Date(iso + "T00:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }); };
  const dueCls = iso => { const n = dayDiff(iso); return n < 0 ? "over" : n <= 2 ? "soon" : ""; };
  $("#today").textContent = new Date().toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
  const setStatus = (s, t) => { const n = $("#status"); n.dataset.s = s; n.textContent = t; };
  const allItems = p => (p.sections || []).flatMap(s => s.items);
  const stacked = () => matchMedia("(max-width:700px)").matches;

  // ---------- layout tree ----------
  // node: {id, kind:"panel", pid} | {id, kind:"split", dir:"row"|"col", group:bool, children:[], sizes:[]}
  const leaf = pid => ({ id: "n-" + pid, kind: "panel", pid });
  const split = (dir, children, sizes, group = false) => ({ id: "s" + uid(), kind: "split", dir, group, children, sizes: sizes || children.map(() => 1) });
  const norm = n => { const t = n.sizes.reduce((a, b) => a + b, 0) || 1; n.sizes = n.sizes.map(s => s / t); };

  function findParent(id, node = state.layout, parent = null, index = -1) {
    if (node.id === id) return { node, parent, index };
    if (node.kind === "split") for (let i = 0; i < node.children.length; i++) { const r = findParent(id, node.children[i], node, i); if (r) return r; }
    return null;
  }
  const contains = (node, id) => node.id === id || (node.kind === "split" && node.children.some(c => contains(c, id)));

  // collapse single-child plain splits, flatten same-direction plain splits, drop empty groups
  function simplify(node) {
    if (node.kind !== "split") return node;
    const kids = [], sizes = [];
    node.children.forEach((c, i) => {
      const s = simplify(c);
      if (!s) return;
      if (s.kind === "split" && !s.group && s.dir === node.dir) { norm(s); s.children.forEach((cc, j) => { kids.push(cc); sizes.push(node.sizes[i] * s.sizes[j]); }); }
      else { kids.push(s); sizes.push(node.sizes[i]); }
    });
    node.children = kids; node.sizes = sizes;
    if (!kids.length) return null;
    norm(node);
    if (kids.length === 1 && !node.group) return kids[0];
    return node;
  }
  function tidy() {
    let r = simplify(state.layout);
    if (!r) r = split("col", []);
    if (r.kind !== "split" || r.group) r = split("col", [r]);
    state.layout = r;
  }
  function removeNode(id) {
    const f = findParent(id); if (!f || !f.parent) return null;
    f.parent.children.splice(f.index, 1); f.parent.sizes.splice(f.index, 1);
    return f.node;
  }
  function insertBeside(targetId, node, side) {
    const f = findParent(targetId); if (!f) return;
    const dir = side === "left" || side === "right" ? "row" : "col";
    const after = side === "right" || side === "bottom";
    if (!f.parent) { state.layout = split(dir, after ? [f.node, node] : [node, f.node]); return; }
    const P = f.parent, i = f.index;
    if (P.dir === dir) {
      const half = P.sizes[i] / 2;
      P.sizes[i] = half; P.children.splice(after ? i + 1 : i, 0, node); P.sizes.splice(after ? i + 1 : i, 0, half);
    } else {
      P.children[i] = split(dir, after ? [f.node, node] : [node, f.node]);
    }
  }
  function pathTo(id, node = state.layout, acc = []) {
    acc.push(node);
    if (node.id === id) return acc;
    if (node.kind === "split") for (const c of node.children) { const r = pathTo(id, c, acc); if (r) return r; }
    acc.pop(); return null;
  }
  // equal shares at every level inside a group; a branch counts by how many bubbles sit side by side in it
  function evenOut(node) {
    if (node.kind !== "split") return;
    const span = n => n.kind !== "split" ? 1 : n.dir === node.dir ? n.children.reduce((a, c) => a + span(c), 0) : Math.max(...n.children.map(span));
    node.sizes = node.children.map(span); norm(node);
    node.children.forEach(evenOut);
  }
  function swapNodes(aId, bId) {
    const a = findParent(aId), b = findParent(bId);
    if (!a?.parent || !b?.parent) return;
    a.parent.children[a.index] = b.node; b.parent.children[b.index] = a.node;
  }

  // free-position boards (earlier version) -> rows of bubbles, groups kept
  function treeFromPositions(panels, groups) {
    const ents = [];
    groups.forEach(g => { const m = panels.filter(p => p.group === g.id); if (m.length) ents.push({ x: g.x, y: g.y, w: g.w, h: g.h, node: split("row", [], [], true), members: m }); });
    panels.filter(p => !p.group || !groups.some(g => g.id === p.group)).forEach(p => ents.push({ x: p.x || 0, y: p.y || 0, w: p.w || 300, h: p.h || 220, node: leaf(p.id) }));
    const rowsOf = items => {
      const rows = [];
      [...items].sort((a, b) => a.y - b.y || a.x - b.x).forEach(it => {
        const r = rows.find(r => it.y < r.y + 140); if (r) r.items.push(it); else rows.push({ y: it.y, items: [it] });
      });
      return rows.map(r => { r.items.sort((a, b) => a.x - b.x); return r; });
    };
    const build = (items, group) => {
      const rows = rowsOf(items);
      const rowNodes = rows.map(r => r.items.length === 1 ? r.items[0].node : split("row", r.items.map(i => i.node), r.items.map(i => i.w)));
      const hs = rows.map(() => 1);
      if (group) { group.dir = rows.length > 1 ? "col" : "row"; if (rows.length > 1) { group.children = rowNodes; group.sizes = hs; } else { group.children = rows[0].items.map(i => i.node); group.sizes = rows[0].items.map(i => i.w); } norm(group); return group; }
      return split("col", rowNodes, hs);
    };
    ents.forEach(e => { if (e.members) build(e.members.map(p => ({ x: p.x || 0, y: p.y || 0, w: p.w || 300, h: p.h || 220, node: leaf(p.id) })), e.node); });
    return build(ents);
  }

  // ---------- data shape ----------
  function migrate(d) {
    if (!d) return { v: 7, panels: [], layout: split("col", []) };
    let panels = d.panels;
    if (!Array.isArray(panels)) {
      panels = [{ id: "goals", type: "goals", title: "Goals", goals: d.goals || [] }, { id: "due", type: "due", title: "Coming up" },
        ...(d.columns || []).map(c => ({ id: c.id, type: "list", title: c.title, items: c.items || [] })),
        { id: "notes", type: "notes", title: "Notes to self", notes: d.notes || [] }];
    }
    // every bubble is the same kind of thing; older typed bubbles become property presets
    const clean = panels.map(p => {
      const o = p.opts || {}, t = p.type;
      const q = { id: p.id, title: p.title || "Untitled", sections: Array.isArray(p.sections) ? p.sections : null };
      if (p.lastReset) q.lastReset = p.lastReset;
      if (!t) q.opts = { ...BASE, ...o };
      else if (t === "list") q.opts = { ...BASE, done: o.done !== false, dates: o.dates !== false, progress: o.progress !== false };
      else if (t === "goals") { q.opts = { ...BASE, ticks: false, progress: false, dates: false, numbers: o.numbers !== false, sub: o.why !== false };
        q.sections = [{ id: "s-" + p.id, title: "", items: (p.goals || []).map(g => ({ id: g.id, text: g.text, sub: g.why || "", done: false, due: "" })) }]; }
      else if (t === "notes") q.opts = { ...BASE, ticks: false, progress: false, dates: false, notes: true, added: o.dates !== false };
      else if (t === "due") q.opts = { ...BASE, ticks: false, progress: false, dates: false, feed: true, overdue: o.overdue !== false, days: o.days || 7 };
      else q.opts = { ...BASE, ...o };
      if (!q.sections) q.sections = [{ id: "s-" + p.id, title: "", items: (t === "notes" ? p.notes : p.items) || [] }];
      return q;
    });
    let layout = d.layout;
    if (!layout || layout.kind !== "split") {
      const hasPos = panels.some(p => typeof p.x === "number");
      layout = hasPos ? treeFromPositions(panels, Array.isArray(d.groups) ? d.groups : [])
        : split("col", [split("row", panels.slice(0, 2).map(p => leaf(p.id))), split("row", panels.slice(2, -1).map(p => leaf(p.id))), ...panels.slice(-1).map(p => leaf(p.id))].filter(n => n.kind === "panel" || n.children.length));
    }
    const out = { v: 7, updated: d.updated || "", boardTitle: d.boardTitle || "My Board", panels: clean, layout };
    state = out; reconcile(); return state;
  }
  // every panel appears exactly once in the tree
  function reconcile() {
    const ids = new Set(state.panels.map(p => p.id)), seen = new Set();
    const walk = n => {
      if (n.kind === "panel") { if (!ids.has(n.pid) || seen.has(n.pid)) return null; seen.add(n.pid); return n; }
      const kids = [], sizes = [];
      n.children.forEach((c, i) => { const r = walk(c); if (r) { kids.push(r); sizes.push(n.sizes?.[i] ?? 1); } });
      n.children = kids; n.sizes = sizes; return n;
    };
    state.layout = walk(state.layout) || split("col", []);
    state.panels.filter(p => !seen.has(p.id)).forEach(p => { state.layout.children.push(leaf(p.id)); state.layout.sizes.push(1 / Math.max(1, state.layout.children.length)); });
    tidy();
  }

  // ---------- persistence ----------
  function commit(opts = {}) {
    state.updated = localRev = new Date().toISOString();
    dirty = true; if (!opts.noRender) render(opts.before);
    try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {}
    if (mode === "local") { if (noAccess) setStatus("error", "Only saved in this browser"); else setStatus("ok", "Saved locally"); dirty = false; return; }
    setStatus("saving", "Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400);
  }
  const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
  async function flush() {
    if (!ref) return;
    if (saving) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); return; }
    saving = true;
    const rev = state.updated, body = JSON.parse(JSON.stringify(state));
    let ok = false, retry = false;
    try { await withTimeout(ref.set(body), 10000); ok = true; }
    catch (e) {
      if (e?.code === "unavailable" || e?.code === "timeout") retry = true;
      else if (e?.code === "invalid_argument" && mode === "db") { mode = "local"; noAccess = true; dirty = false; setStatus("error", "Only saved in this browser"); }
      else setStatus("error", "Not saved");
    }
    saving = false;
    if (ok && state.updated === rev) { dirty = false; setStatus("ok", "Saved"); drainPending(); }
    else if (ok || retry) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, retry ? 1000 + Math.random() * 1000 : 50); }
  }
  function drainPending() { if (pending && !dirty && !editing && !gesture) { const p = pending; pending = null; applyRemote(p); } }
  function applyRemote(data) {
    if (!data || (data.updated || "") <= localRev) return;
    if (dirty || saving || editing || gesture || document.activeElement?.closest?.(".adder")) { pending = data; return; }
    const before = rects(); migrate(data); localRev = state.updated || localRev; render(before);
  }
  // a blank-but-useful starting board for someone opening this for the first time
  function starter() {
    const id = () => uid();
    const goals = id(), todo = id(), habits = id(), due = id(), notes = id();
    const P = (pid, title, opts, items = []) => ({ id: pid, title, opts: { ...BASE, ...opts }, sections: [{ id: id(), title: "", items: items.map(t => ({ id: id(), text: t, done: false, due: "", ts: new Date().toISOString() })) }] });
    return {
      v: 7, boardTitle: "My Board",
      panels: [
        P(goals, "Goals", { ticks: false, progress: false, dates: false, numbers: true, sub: true }, ["Click here to write your first goal"]),
        P(due, "Coming up", { ticks: false, progress: false, dates: false, feed: true }),
        P(todo, "To do", {}, ["Try ticking me", "Drag the ⋮⋮ grip to reorder", "Give a task a date and it appears in Coming up"]),
        P(habits, "Daily habits", { dates: false, daily: true }, ["Unticks itself every morning"]),
        P(notes, "Notes", { ticks: false, progress: false, dates: false, notes: true, added: true }, ["Rename anything by clicking it. Drag bubbles by their empty space, resize with the gaps between them, and use ··· for each bubble's properties."]),
      ],
      layout: split("col", [split("row", [leaf(goals), leaf(due)], [1, 1]), split("row", [leaf(todo), leaf(habits)], [1.4, 1]), leaf(notes)], [1, 1.1, 0.8]),
    };
  }
  let noAccess = false;

  // ---------- cloud storage (Supabase): one row per person, protected by row-level security ----------
  function cloudRef(uid) {
    const sb = window.sb;
    const snapOf = d => ({ exists: !!d, data: () => d ? JSON.parse(JSON.stringify(d)) : undefined, metadata: { fromCache: false, hasPendingWrites: false } });
    return {
      async set(body) {
        const { error } = await sb.from("boards").upsert({ user_id: uid, data: body, updated_at: new Date().toISOString() });
        if (error) throw { code: /row-level security|permission denied/i.test(error.message || "") ? "invalid_argument" : "unavailable", message: error.message };
      },
      onSnapshot(next, onErr) {
        let first = true;
        const pull = async () => {
          const { data, error } = await sb.from("boards").select("data").eq("user_id", uid).maybeSingle();
          if (error) { if (first) onErr?.(error); return; }
          first = false; next(snapOf(data ? data.data : null));
        };
        pull();
        // live updates from your other devices; a slow poll covers dropped connections
        const ch = sb.channel("board-" + uid)
          .on("postgres_changes", { event: "*", schema: "public", table: "boards", filter: `user_id=eq.${uid}` }, payload => { if (payload.new && payload.new.data) next(snapOf(payload.new.data)); })
          .subscribe();
        const t = setInterval(() => { if (!document.hidden) pull(); }, 60000);
        const onVis = () => { if (!document.hidden) pull(); };
        document.addEventListener("visibilitychange", onVis);
        return () => { clearInterval(t); document.removeEventListener("visibilitychange", onVis); sb.removeChannel(ch); };
      },
    };
  }

  function showNotice(text, actions) {
    const n = $("#notice");
    n.replaceChildren(el("span", { text }), ...actions.map(([label, fn]) => el("button", { class: "seg", type: "button", text: label, onclick: () => { n.hidden = true; fn(); } })),
      el("button", { class: "x", type: "button", "aria-label": "Dismiss", text: "×", onclick: () => { n.hidden = true; } }));
    n.hidden = false;
  }

  async function boot(uid) {
    LS = "bubble-board-site:" + uid;
    try { const c = JSON.parse(localStorage.getItem(LS) || "null"); if (c) { migrate(c); localRev = state.updated || ""; } } catch (e) {}
    render();
    mode = "db"; ref = cloudRef(uid);
    let firstReal = true;
    ref.onSnapshot(sd => {
      const data = sd.exists ? sd.data() : null;
      if (firstReal) {
        firstReal = false;
        if (!data && !state.panels.length) {
          migrate(starter()); render(); commit();
          showNotice("New board. Moving one across from Claude?", [["Import a board file", pickImport]]);
          return;
        }
        if (state.panels.length && (!data || (data.updated || "") < localRev)) { dirty = true; flush(); return; }
        if (data && !data.layout) { const before = rects(); migrate(data); render(before); commit({ noRender: true }); return; }
      }
      if (data) applyRemote(data);
      setTimeout(checkDaily, 50);
      if (!dirty && !saving) setStatus("ok", "Synced");
    }, () => setStatus("error", "Offline: changes kept on this device"));
  }

  // ---------- backup & import ----------
  function downloadBackup() {
    const name = (state.boardTitle || "board").replace(/[^\w\- ]+/g, "").trim().replace(/\s+/g, "-") || "board";
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const a = el("a", { href: URL.createObjectURL(blob), download: `${name}-${todayStr()}.json` });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function pickImport() {
    const inp = el("input", { type: "file", accept: ".json,application/json" });
    inp.addEventListener("change", async () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      let d;
      try { d = JSON.parse(await f.text()); } catch (e) { alert("That file isn't a board file (it couldn't be read as JSON)."); return; }
      if (d && !Array.isArray(d.panels) && d.data && Array.isArray(d.data.panels)) d = d.data;   // a raw export
      if (!d || !Array.isArray(d.panels)) { alert("That file doesn't contain a board."); return; }
      const n = d.panels.length;
      if (!confirm(`Replace the board on this account with "${d.boardTitle || "Imported board"}" (${n} bubble${n === 1 ? "" : "s"})?\n\nTip: download a backup first if you want to keep the current one.`)) return;
      const before = rects(); migrate(d); localRev = ""; commit({ before });
      setStatus("ok", "Imported");
    });
    inp.click();
  }

  // ---------- inline edit ----------

    const here = location.origin + location.pathname;
    try {
      if (authMode === "signin") {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error; start(data.session);
      } else if (authMode === "signup") {
        const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: here } });
        if (error) throw error;
        if (data.session) start(data.session);
        else say("Nearly there: open the confirmation email we just sent, then sign in.", "ok");
      } else if (authMode === "reset") {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: here });
        if (error) throw error;
        say("If that email has an account, a reset link is on its way.", "ok");
      } else if (authMode === "newpass") {
        const { error } = await sb.auth.updateUser({ password });
        if (error) throw error;
        authEl.hidden = true; setStatus("ok", "Password updated");
      }
    } catch (err) { say(friendly(err.message), "err"); }
    go.disabled = false;
  });

  function start(session) {
    if (!session || booted) return;
    booted = true;
    authEl.hidden = true; $("#app").hidden = false;
    const email = session.user.email || "";
    $("#acctBtn").textContent = (email[0] || "•");
    boot(session.user.id);
  }

  // account menu
  const acctBtn = $("#acctBtn");
  let acctPop = null;
  const closeAcct = () => { acctPop?.remove(); acctPop = null; acctBtn.setAttribute("aria-expanded", "false"); };
  acctBtn.addEventListener("click", async e => {
    e.stopPropagation(); if (acctPop) { closeAcct(); return; }
    const { data } = await sb.auth.getUser();
    acctPop = el("div", { class: "pop", role: "menu" },
      el("div", { class: "who", text: data?.user?.email || "" }),
      el("button", { type: "button", role: "menuitem", text: "Download a backup", onclick: () => { closeAcct(); downloadBackup(); } }),
      el("button", { type: "button", role: "menuitem", text: "Import a board file", onclick: () => { closeAcct(); pickImport(); } }),
      el("button", { type: "button", role: "menuitem", text: "Change password", onclick: () => { closeAcct(); showAuth("newpass"); } }),
      el("hr"),
      el("button", { type: "button", role: "menuitem", text: "Sign out", onclick: async () => { closeAcct(); await sb.auth.signOut(); location.reload(); } }));
    acctBtn.after(acctPop); acctBtn.setAttribute("aria-expanded", "true");
  });
  document.addEventListener("click", e => { if (acctPop && !acctPop.contains(e.target) && e.target !== acctBtn) closeAcct(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAcct(); });

  (async () => {
    const cfg = window.BOARD_CONFIG || {};
    if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseKey || /YOUR-|PASTE/.test(cfg.supabaseUrl + cfg.supabaseKey)) {
      showAuth("signin"); go.disabled = true;
      say("Setup needed: add your Supabase project URL and publishable key to config.js.", "err");
      return;
    }
    window.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
    sb.auth.onAuthStateChange((event, session) => {
      if (event === "PASSWORD_RECOVERY") { start(session); showAuth("newpass"); }
      else if (event === "SIGNED_IN" && session) start(session);
      else if (event === "SIGNED_OUT" && booted) location.reload();
    });
    const { data } = await sb.auth.getSession();
    if (data.session) start(data.session); else if (!booted) showAuth("signin");
  })();
})();
</script>

</body>
</html>
